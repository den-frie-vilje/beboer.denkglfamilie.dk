# Builds and signs the staging images when the Dockerfiles change on the staging
# branch. The nas-sites agent on the NAS verifies the signatures and pulls
# within a few minutes of the build, so for production the merge to main is
# the deploy: see README.md for the service-window procedure. The two jobs
# run in sequence because the shared workflow serialises on (repository,
# environment), and a cancelled run leaves an unsigned tag.

name: Deploy to staging

on:
  push:
    branches: [staging]
    paths: [deploy/Dockerfile.humhub, deploy/Dockerfile.nginx, deploy/pre-start.sh]
  workflow_dispatch:

jobs:
  # The version check gates the build: both Dockerfiles at one version, digests
  # as Docker Hub serves them, no skipped minor since the previous commit.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: tools/check-version.sh "${{ github.event.before }}"
  humhub:
    needs: check
    uses: den-frie-vilje/nas-sites/.github/workflows/build-and-sign.yml@v1
    with:
      environment: staging
      dockerfile: deploy/Dockerfile.humhub
      image-name: ghcr.io/den-frie-vilje/beboer-humhub
  nginx:
    needs: humhub
    uses: den-frie-vilje/nas-sites/.github/workflows/build-and-sign.yml@v1
    with:
      environment: staging
      dockerfile: deploy/Dockerfile.nginx
      image-name: ghcr.io/den-frie-vilje/beboer-nginx
