# Throwaway stack for tools/test-modules.sh: the two images built from this
# repository's Dockerfiles on an empty database, with nothing from the NAS
# mounted and nothing kept afterwards. The entrypoint installs HumHub and
# creates the test administrator (HUMHUB_AUTO_INSTALL). Mail is pointed at a
# port nothing listens on, so no mail leaves the stack.
name: beboer-test

services:
  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nginx
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - modules:/var/www/localhost/htdocs/protected/modules
      - assets:/var/www/localhost/htdocs/assets
      - uploads:/var/www/localhost/htdocs/uploads
    depends_on:
      humhub:
        condition: service_healthy

  humhub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.humhub
    environment:
      HUMHUB_DB_USER: humhub
      HUMHUB_DB_PASSWORD: humhub
      HUMHUB_DB_HOST: db
      HUMHUB_DB_NAME: humhub
      HUMHUB_AUTO_INSTALL: 1
      HUMHUB_PROTO: http
      HUMHUB_HOST: 127.0.0.1:18080
      HUMHUB_ADMIN_LOGIN: admin
      HUMHUB_ADMIN_PASSWORD: test-modules
      HUMHUB_MAILER_TRANSPORT_TYPE: smtp
      HUMHUB_MAILER_HOSTNAME: 127.0.0.1
      HUMHUB_MAILER_PORT: 1025
    volumes:
      - modules:/var/www/localhost/htdocs/protected/modules
      - assets:/var/www/localhost/htdocs/assets
      - uploads:/var/www/localhost/htdocs/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 300s

  db:
    image: mariadb:10.11@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: humhub
      MYSQL_USER: humhub
      MYSQL_PASSWORD: humhub
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  modules:
  assets:
  uploads:
