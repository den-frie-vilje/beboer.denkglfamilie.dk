        # GHSA-wp2f-p7f6-j3rw: HumHub < 1.19.4 builds a file path from the category
        # given to i18n/translations without validating it, so an anonymous request
        # can read any PHP file's array, the database credentials included. Until
        # the image carries 1.19.4, the category is held to what the fix accepts
        # (humhub/humhub v1.19.4 I18nController: plain names, no "..") joined by
        # commas, and anything else is refused here. Remove with the 1.19.4 bump.
        set $i18n_category_rejected 0;
        if ($uri ~* "^(/index\.php)?/i18n/translations/?$") { set $i18n_category_rejected 1; }
        if ($arg_category ~ "^(?!.*\.\.)[A-Za-z0-9_.,-]+$") { set $i18n_category_rejected 0; }
        if ($i18n_category_rejected) { return 400; }
